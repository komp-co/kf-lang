name: Open release PR

# Whenever `development` carries a kflat_version() above `main`'s, a PR from
# `development` into `main` is open. Merging it is the release, and stays a
# person's decision.
on:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: open-release
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with main
        id: versions
        run: |
          new=$(sh scripts/release-version.sh HEAD)
          old=$(sh scripts/release-version.sh origin/main)
          higher=$(printf '%s\n%s\n' "${old:-0.0.0}" "$new" | sort -V | tail -1)
          if [ -n "$new" ] && [ "$new" != "${old:-0.0.0}" ] && [ "$higher" = "$new" ]; then
            echo "release=$new" >> "$GITHUB_OUTPUT"
          fi
          echo "main has ${old:-none}, development has $new"

      # RELEASE_TOKEN opens it, so it runs CI; the workflow's token would not.
      - name: Open the release PR
        if: steps.versions.outputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.release }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is missing; open the release PR from development into main by hand"
            exit 0
          fi
          open=$(gh pr list --base main --head development --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "a release PR is already open"
            exit 0
          fi
          merged=$(git log --first-parent --format='%s' origin/main..HEAD |
            sed -n 's/^Merge pull request \(#[0-9]*\) from .*/- \1/p')
          body=$(printf '%s\n\n%s\n%s\n' \
            "Releases \`development\` as **kflat $VERSION**. Merging this publishes \`v$VERSION\` with its seed, then opens the PR that pins that seed on \`development\`." \
            "Merged since the last release:" "$merged")
          gh pr create --base main --head development --title "Release kflat $VERSION" --body "$body"
