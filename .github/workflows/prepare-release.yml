name: Prepare release

# Step one of a release, by hand from the Actions tab: raise kflat_version()
# on `development` through a PR that merges itself once CI is green. That
# merge opens the release PR into `main` (open-release.yml); merging that one
# is the release (release.yml).
on:
  workflow_dispatch:
    inputs:
      part:
        description: The part of the version that goes up
        type: choice
        options: [minor, patch, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          persist-credentials: false

      - uses: ./.github/actions/release-bot
        id: bot
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Raise the version and open its PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PART: ${{ inputs.part }}
        run: |
          old=$(sh scripts/release-version.sh)
          new=$(sh scripts/release-version.sh --next "$PART")
          branch="release/$new"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already exists: a $new release is already being prepared" >&2
            exit 1
          fi
          sh scripts/release-version.sh --set "$new"
          git switch -c "$branch"
          git commit -qam "release: kflat $new" -m "Raises kflat_version() from $old for the next release."
          git push -q origin "$branch"
          url=$(gh pr create --base development --head "$branch" --title "release: kflat $new" \
            --body "Raises \`kflat_version()\` from $old to $new. Once this merges, the release PR from \`development\` into \`main\` opens by itself; merging that one publishes \`v$new\`.")
          gh pr merge --auto --merge "$url"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
