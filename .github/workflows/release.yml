name: Release

# Pushing a `vX.Y.Z` tag publishes a release whose asset is the seed: this
# commit's komp and kflatc as C, built from the pinned seed and verified by the
# fixpoint. Pinning that release in bootstrap/stage0.toml makes it the seed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: The tag names the version in the source
        run: |
          version=$(sed -n 's/^ *return "\(.*\)"$/\1/p' compiler/kf-driver/src/cli/version.kf)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, but kflat_version() says $version" >&2
            exit 1
          fi

      - name: Build the seed and verify the fixpoint
        run: sh bootstrap/build.sh --seed-out dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "kflat ${GITHUB_REF_NAME#v}" --generate-notes
