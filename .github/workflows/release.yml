name: Release

# A merge into `main` is a release: this workflow builds this commit's kflatc
# as C from the pinned seed, verifies the fixpoint, and publishes the seed and
# the toolchain archive komp installs, kflat-<version>.tar.gz with its
# .sha256, under the tag `v<kflat_version()>`. Then it opens the PR that pins
# the new seed in bootstrap/stage0.toml on `development`, merging once CI is
# green, and the one that lists the archive as `kflatc` in komp-co/index,
# where `komp toolchain install` finds it, merging once the index checks it.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_TOKEN pushes the pin, so its PR runs CI; without it the release
      # still publishes, and the pin is left to a person.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: ./.github/actions/setup

      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sh scripts/release-version.sh)
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; a release PR must bump kflat_version()" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the seed and verify the fixpoint
        run: sh bootstrap/build.sh --seed-out dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "kflat $VERSION" --generate-notes

      - name: Pin the new seed on development
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/kflat-seed-${{ steps.version.outputs.version }}.tar.gz
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is missing; pin v$VERSION in bootstrap/stage0.toml by hand"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sha256=$(cut -d' ' -f1 "dist/kflat-seed-$VERSION.tar.gz.sha256")
          branch="seed/$VERSION"
          git fetch -q origin development
          git switch -q -c "$branch" origin/development
          sed -i -e "s|^version = .*|version = \"$VERSION\"|" \
                 -e "s|^url = .*|url = \"$URL\"|" \
                 -e "s|^sha256 = .*|sha256 = \"$sha256\"|" bootstrap/stage0.toml
          git commit -qam "bootstrap: build from the $VERSION seed" -m "Pins v$VERSION, published by the release workflow."
          git push -q origin "$branch"
          url=$(gh pr create --base development --head "$branch" --title "bootstrap: build from the $VERSION seed" \
            --body "Pins the seed \`v$VERSION\` just published in \`bootstrap/stage0.toml\`. CI bootstraps from it, so a green run proves the release builds this tree.")
          gh pr merge --auto --merge "$url"

      - name: List the release in the package index
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/kflat-${{ steps.version.outputs.version }}.tar.gz
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is missing; add kflatc $VERSION to komp-co/index by hand"
            exit 0
          fi
          sha256=$(cut -d' ' -f1 "dist/kflat-$VERSION.tar.gz.sha256")
          index="$RUNNER_TEMP/index"
          gh repo clone komp-co/index "$index" -- -q
          gh auth setup-git
          cd "$index"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="kflatc/$VERSION"
          git switch -q -c "$branch"
          printf '\n[[version]]\nversion = "%s"\nsource = { tarball = "%s" }\nchecksum = "sha256:%s"\n' \
            "$VERSION" "$URL" "$sha256" >> kf/la/kflatc.toml
          git commit -qam "kflatc $VERSION" -m "Published by kf-lang's release workflow."
          git push -q origin "$branch"
          gh pr create --repo komp-co/index --base main --head "$branch" --title "kflatc $VERSION" \
            --body "The kflat $VERSION release archive, as \`kflatc\`. The index checks it and merges it."
