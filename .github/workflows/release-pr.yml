name: Release PR

# `main` takes only releases: a PR from `development` that raises
# kflat_version() past what `main` has. A required check on `main`.
on:
  pull_request:
    branches: [main]

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: From development
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "development" ]; then
            echo "main takes PRs from development only, and this one is from $HEAD" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raises the version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          new=$(sh scripts/release-version.sh HEAD)
          old=$(sh scripts/release-version.sh "origin/$BASE")
          echo "main has ${old:-none}, this PR releases $new"
          higher=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)
          if [ -n "$old" ] && { [ "$higher" != "$new" ] || [ "$old" = "$new" ]; }; then
            echo "bump kflat_version() in compiler/kf-driver/src/version.kf past $old" >&2
            exit 1
          fi
