name: Release PR

# `main` takes only releases: a PR from `development` that raises
# kflat_version() past what `main` has. A required check on `main`.
on:
  pull_request:
    branches: [main]

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: From development
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "development" ]; then
            echo "main takes PRs from development only, and this one is from $HEAD" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raises the version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # The file is found by what it defines, so moving it breaks no release.
          version_at() {
            file=$(git grep -l "fun kflat_version" "$1" -- compiler | head -1)
            [ -n "$file" ] && git show "$file" | sed -n 's/^ *return "\(.*\)"$/\1/p'
          }
          new=$(version_at HEAD)
          old=$(version_at "origin/$BASE")
          echo "main has ${old:-none}, this PR releases $new"
          if [ -n "$old" ] && [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" -o "$old" = "$new" ]; then
            echo "bump kflat_version() in compiler/kf-shared/src/version.kf past $old" >&2
            exit 1
          fi
