name: Release PR

# `main` takes only releases: a PR from `development` that raises
# kflat_version() past what `main` has. A required check on `main`.
on:
  pull_request:
    branches: [main]

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: From development
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != "development" ]; then
            echo "main takes PRs from development only, and this one is from $HEAD" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Raises the version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          read_version() { sed -n 's/^ *return "\(.*\)"$/\1/p'; }
          new=$(read_version < compiler/kf-driver/src/cli/version.kf)
          old=$(git show "origin/$BASE:compiler/kf-driver/src/cli/version.kf" 2>/dev/null | read_version)
          echo "main has ${old:-none}, this PR releases $new"
          if [ -n "$old" ] && [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" -o "$old" = "$new" ]; then
            echo "bump kflat_version() in compiler/kf-driver/src/cli/version.kf past $old" >&2
            exit 1
          fi
