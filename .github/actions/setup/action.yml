name: Set up a komp job
description: The json sibling, ccache in front of cc, and optionally the komp the fixpoint job built.
inputs:
  prebuilt:
    description: Download the komp and kflatc the fixpoint job uploaded.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Clone json beside komp
      shell: sh
      run: git clone -q --depth 1 https://github.com/komp-co/json ../json

    - name: Install ccache
      shell: sh
      run: sudo apt-get install -y -qq --no-install-recommends ccache > /dev/null

    - uses: actions/cache@v4
      with:
        path: ~/.cache/kflat/seeds
        key: seed-${{ hashFiles('bootstrap/stage0.toml') }}

    - uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ github.job }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}-

    # The fixtures compile under a fresh temp directory per run; BASEDIR keeps
    # that path out of the hash, or nothing would ever hit.
    - name: Put ccache in front of cc
      shell: sh
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_BASEDIR=/tmp" >> "$GITHUB_ENV"
        mkdir -p "$HOME/.ccache"
        CCACHE_DIR="$HOME/.ccache" ccache --set-config max_size=2G

    - if: inputs.prebuilt == 'true'
      uses: actions/download-artifact@v4
      with:
        name: komp-bin
        path: ${{ runner.temp }}/komp-bin

    - if: inputs.prebuilt == 'true'
      shell: sh
      run: |
        chmod +x "$RUNNER_TEMP/komp-bin/komp" "$RUNNER_TEMP/komp-bin/kflatc"
        echo "KOMP_PREBUILT=$RUNNER_TEMP/komp-bin/komp" >> "$GITHUB_ENV"
